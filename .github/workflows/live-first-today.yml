name: Live First Today

on:
  push:
    branches: [main]
    paths:
      - scripts/live-first-today.mjs
      - .github/workflows/live-first-today.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/live-first-today.mjs
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Commit live-first Today experience
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/status.ts components/GrandCouleeDashboard.tsx components/PhotographicDamExplorer.tsx
          git commit -m "Make Today card live-data first"
          git push
