name: Probe DART Grand Coulee

on:
  push:
    paths:
      - 'scripts/probe-dart.mjs'
      - '.github/workflows/probe-dart.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/probe-dart.mjs
