name: Focus Live Copy

on:
  push:
    branches: [main]
    paths:
      - scripts/focus-live-copy.mjs
      - .github/workflows/focus-live-copy.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/focus-live-copy.mjs
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Commit live-first copy
        run: |
          if git diff --quiet; then
            echo "No copy changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/GrandCouleeDashboard.tsx
          git commit -m "Focus Grand Coulee on live visitor decisions"
          git push
