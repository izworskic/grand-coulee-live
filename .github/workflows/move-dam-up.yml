name: Move Dam Up

on:
  push:
    branches: [main]
    paths:
      - scripts/move-dam-up.mjs
      - .github/workflows/move-dam-up.yml
      - app/light-theme.css
      - app/layout.tsx

permissions:
  contents: write

jobs:
  restyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/move-dam-up.mjs
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Commit dam-priority layout
        run: |
          if git diff --quiet; then
            echo "No layout changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/GrandCouleeDashboard.tsx
          git commit -m "Move See the Dam ahead of visit planning"
          git push
