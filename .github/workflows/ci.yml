name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Validate generation model against reported daily history
        continue-on-error: true
        run: npm run backtest
      - name: Check major upstream sources
        continue-on-error: true
        run: node scripts/probe-sources.mjs
      - name: Probe live Grand Coulee CWMS series
        continue-on-error: true
        run: node scripts/probe-cwms.mjs
