name: Probe all Grand Coulee telemetry

on:
  push:
    paths:
      - 'scripts/probe-all-gcl.mjs'
      - '.github/workflows/probe-all-gcl.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe every GCL CWMS series
        run: node scripts/probe-all-gcl.mjs
