name: Vercel secret availability check
on:
  push:
    branches:
      - deploy/platte-crane-live
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence without exposing values
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -n "${!v}" ]; then echo "$v=present"; else echo "$v=missing"; fi
          done
