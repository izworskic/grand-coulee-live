name: Source Watch

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check major upstream sources
        run: node scripts/probe-sources.mjs
      - name: Inspect individual Grand Coulee CWMS series
        if: always()
        run: node scripts/probe-cwms.mjs
